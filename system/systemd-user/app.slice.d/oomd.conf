# systemd-oomd: when memory pressure in the apps stays above 50% for 30 s, stop the app (cgroup)
# that causes it, so the desktop does not freeze. Only apps (app.slice) can be stopped. Session
# services (dbus, pipewire, the portals in session.slice) are never chosen: losing one breaks the session.
# The swap rule for the whole system is in system/etc/systemd/system/-.slice.d/oomd.conf.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
