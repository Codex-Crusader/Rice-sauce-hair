# mkinitcpio settings of this machine. mkinitcpio reads this file after /etc/mkinitcpio.conf,
# so /etc/mkinitcpio.conf stays the package original and an update needs no merge.
# After a change: sudo mkinitcpio -P

# udev, not systemd, in the initramfs: the grub-btrfs-overlayfs hook needs it. That hook lets a
# read-only snapshot boot from the GRUB menu. keymap and consolefont replace sd-vconsole.
HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block filesystems fsck grub-btrfs-overlayfs)
