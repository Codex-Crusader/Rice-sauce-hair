# GRUB settings for this desktop. grub-mkconfig reads this file after /etc/default/grub,
# so /etc/default/grub stays the package original and a GRUB update needs no merge.
# After a change: sudo grub-mkconfig -o /boot/grub/grub.cfg

GRUB_GFXMODE=1920x1080,auto
GRUB_THEME="/boot/grub/themes/amphora/theme.txt"

# Dual boot with Windows: /etc/grub.d/05_windows (in system/etc/grub.d) adds a "windows" entry.
# To start Windows by default, remove the # here:
#GRUB_DEFAULT=windows
#GRUB_DISABLE_OS_PROBER=true
